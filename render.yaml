services:
  - type: web
    name: selldevices
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: selldevices-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
databases:
  - name: selldevices-db
    plan: free
    databaseName: selldevices
    user: selldevices
